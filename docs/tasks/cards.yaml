  input: "合并后的帧（`<done>/merged/`）+ 原 meta（队列清单 + manifest.tasks 的数字身份/原尺寸/原锚点）"
  output: "assets/hd/<档案>/<资源>-<图>.png + manifest 条目（模型/参数/输入输出哈希、outAnchor ×实际倍率）"
  algorithm: |
    1. 帧顺序按队列清单（= 原素材清单顺序）走。
    2. 锚点用 upscale 的 recordResult（内部按**实际输出尺寸**缩放）——不是把 scale 乘一下了事，
       工具常把结果对齐到 4 的倍数，按请求值算会系统性偏移。
    3. 落盘前校验产物尺寸恰为 原图×scale（与 T-062 同一条规则），不合规不写 hd。
    4. 幂等：产物哈希与该条目上次记录的 outHash 相同 → 整帧跳过，一个字节都不重写。
  tests: "锚点 ×4；manifest 幂等（连跑两次 written 为空）；尺寸不合规不落盘"
  files: [packages/assets-pipeline/src/assemble.ts, packages/assets-pipeline/src/assemble.test.ts, packages/assets-pipeline/src/cli-upscale.ts]
  notes: "hd 路径由 assemble.ts 的 hdRelativePath **单点定义**，client 的 SpriteCache（T-065）读同一函数（PRD §4.5）。"

- id: T-064
  group: D
  title: 地形 tile 接缝检查
  module: MOD-11
  req: REQ-11.1
  status: done
  estimate: 0.5
  depends_on: [T-063]
  uses: [assets-pipeline/src/ground.ts (布局表)]
  source: "C-AST-7（其判据已按实测改写，见 DEVELOPMENT_PLAN §5.4）"
  input: "★ **原图 + 放大图**两张（同图放大前后）＋ GND 布局；不是只看放大图"
  output: "报告：放大后**新增**的接缝（增量 ΔE 降序）+ 坐标；可选自动修补（边缘 2px 双向羽化）"
  algorithm: |
    ★ 判据是**放大前后对比**，不是绝对阈值 —— 这是实测逼出来的结论：
      原版底图同时有高频纹理（水面/草地）与真地形交界，只看放大图的阈值区分不了
      它们与超分伪影（逐像素 ΔE>2.3 报 10224/10224，带内均值也报约 60%，而画面肉眼无接缝）。
    1. compareTileSeams(original, upscaled)：逐条缝算**带内均值** ΔE（先对带内像素求 RGB
       均值再转 Lab，顺带抹掉高频噪声），after − before > 一个 JND(2.3) 才报。
    2. 取带宽度两侧按 scale 换算，保证比的是同一段地形长度。
    3. findTileSeams 保留为**诊断**用途（单图绝对色差），明确标注「真地形边界也会报」。
    4. featherSeams：两侧各 band 像素成对线性过渡，对侧颜色只从输入快照读（否则越补越糊）。
  tests: "人造接缝被检出；无缝样本 0 报告；★ 忠实放大 0 误报；★ 噪声纹理不误报；尺寸非整数倍抛错"
  files: [packages/assets-pipeline/src/seams.ts, packages/assets-pipeline/src/seams.test.ts]
  notes: "⚠️ 底图目前不在超分清单里（Q-GND-4），无真实输入，只能用合成夹具验；已在真实地图上验证判据（忠实 ×4 报 0/60）。"

