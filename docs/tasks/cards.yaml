- id: T-013
  group: B
  title: 翻译股票打分函数 0x0042c075，AI 买哪一支（P1-4）
  module: MOD-09
  req: REQ-09.1
  status: done
  estimate: 1.0
  depends_on: []
  uses:
    - core/ai/stock-policy.ts (decideStockTrade)
    - core/places/stock-market.ts (StockState, isLimitUp)
    - core/places/company.ts (companyFunds 累積盈餘)
    - data/stocks.ts
  source: "VA 0x0042c075 起约 700 行；企業 +0x24 資產額、+0x2c 累積盈餘"
  input: "state.market.stocks[12], state.holdings[me], commercials[], companyFunds[], me.cash, me.stockRatio"
  output: "scoreStock(j) → number；pickStockToBuy(state) → index | -1；买多少股沿用现有 stockRatio 预算"
  algorithm: |
    1. 逐段翻译打分：每个指标写成独立小函数（如 trendScore、valueScore、holdingPenalty），带 VA。
    2. 浮点部分用 Math.fround 保持单精度顺序；整数部分 Math.trunc。
