- id: T-064
  group: D
  title: 地形 tile 接缝检查
  module: MOD-11
  req: REQ-11.1
  status: done
  estimate: 0.5
  depends_on: [T-063]
  uses: [assets-pipeline/src/ground.ts (布局表)]
  source: "C-AST-7（其判据已按实测改写，见 DEVELOPMENT_PLAN §5.4）"
  input: "★ **原图 + 放大图**两张（同图放大前后）＋ GND 布局；不是只看放大图"
  output: "报告：放大后**新增**的接缝（增量 ΔE 降序）+ 坐标；可选自动修补（边缘 2px 双向羽化）"
  algorithm: |
    ★ 判据是**放大前后对比**，不是绝对阈值 —— 这是实测逼出来的结论：
      原版底图同时有高频纹理（水面/草地）与真地形交界，只看放大图的阈值区分不了
      它们与超分伪影（逐像素 ΔE>2.3 报 10224/10224，带内均值也报约 60%，而画面肉眼无接缝）。
    1. compareTileSeams(original, upscaled)：逐条缝算**带内均值** ΔE（先对带内像素求 RGB
       均值再转 Lab，顺带抹掉高频噪声），after − before > 一个 JND(2.3) 才报。
    2. 取带宽度两侧按 scale 换算，保证比的是同一段地形长度。
    3. findTileSeams 保留为**诊断**用途（单图绝对色差），明确标注「真地形边界也会报」。
    4. featherSeams：两侧各 band 像素成对线性过渡，对侧颜色只从输入快照读（否则越补越糊）。
  tests: "人造接缝被检出；无缝样本 0 报告；★ 忠实放大 0 误报；★ 噪声纹理不误报；尺寸非整数倍抛错"
  files: [packages/assets-pipeline/src/seams.ts, packages/assets-pipeline/src/seams.test.ts]
  notes: "⚠️ 底图目前不在超分清单里（Q-GND-4），无真实输入，只能用合成夹具验；已在真实地图上验证判据（忠实 ×4 报 0/60）。"

- id: T-065
  group: D
  title: SpriteCache 按图优先读 hd，缺则回退原图
  module: MOD-12
  req: REQ-11.1
  status: done
  estimate: 0.4
  depends_on: [T-063]
  uses: [client/assets.ts (SpriteCache), client/host.ts (assetBase/hdBase), client/main.ts (boot 接线)]
  source: "PRD §4.5"
  input: "get(archive, resource, image)"
  output: "hd 存在 → 4× 位图 + 锚点取清单记的值；否则原图。**按图回退**，不是整包"
  algorithm: |
    1. loadHdSource(hdBase)：拉 `<hd 目录>-manifest.json`（与目录同级），
       只有**既有 tasks 又有 results** 的图才算有 HD；拉不到就整包走原图。
    2. hdSourceFromManifest：档案名要去掉 `.mkf`（清单里存的是 `Data`）；
       取产物用 upscale.ts 的 hdRelativePath（写读两侧同一函数）。
    3. SpriteCache.get：HD 优先，fetch/解码任一环失败就回退原图这一张。
    4. ★ HD 路径**不补 colorKeyBlack**：透明性管线已烘进 alpha，且 AI 放大后
       「纯黑」不再是精确 0，按 RGB==0 再抠一次只会抠不动或抠错。
    5. ★ HD 产物交**浏览器原生解码**（`createImageBitmap(new Blob([bytes]))`），
       不自己 `decodePng` —— 那会经 `png.ts` 把 `node:zlib` 拖进前端包（Q-BUILD-1）。
       尺寸取自位图、锚点取自清单，都不需要 JS 解 PNG。
    6. LRU：精灵与原始字节各有上限；淘汰时调 onEvict 通知持有引用的一方
       （真正的内存释放要消费方配合，见 Q-PERF-1）。
  tests: "回退路径 6 条（无来源/拉不到/坏 PNG/按图混用/空槽/缓存命中）；LRU 4 条；清单 4 条"
  files: [packages/client/src/assets.ts, packages/client/src/assets.test.ts, packages/client/src/host.ts, packages/client/src/main.ts]
  notes: "⚠️ LRU 只移出自己这张表，释放内存需 render.ts 接 onEvict（Q-PERF-1）；桌面端 hd 路由未接（同条）。"

