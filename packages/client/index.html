<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大富翁4 重制版</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      /* ★ 第十二份試玩回報：iPad Safari 地址栏遮住工具栏。**不用 `100vh`** —— 它在 iOS/iPadOS
         Safari 上是「地址栏收起时」的最大高度，地址栏展开时比可视区高，文档还能被拖着卷上去。
         改成固定定位贴满当前视口（包含块随地址栏伸缩），文档本身没有可滚的高度；
         有 `visualViewport` 时 main.ts 再把 top/left/width/height 钉成它那块（见 viewport.ts）。 */
      html { height: 100%; overflow: hidden; overscroll-behavior: none; }
      body {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        margin: 0; overflow: hidden; overscroll-behavior: none; display: flex; background: #000; color: #e6e8ee;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      }
      /* ★ 游戏画面是一块 640×480 的定屏，整数倍放大居中 —— 见 stage.ts */
      #board {
        flex: 1 1 0; min-width: 0; width: 100%; height: 100%; display: block;
        cursor: default; image-rendering: pixelated;
        /* ★ 触屏（需求方 2026-09-24）：手势全由 touch-input.ts 接管 —— 不滚动/不缩放、
           长按不弹 iOS 的放大镜/拷贝菜单、不选字、点按不闪灰底 */
        touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* ★ 触屏的「取消」钮 = 一次右键（原版处处用右键取消，触屏上没有右键）。
         只在触屏、且此刻右键有东西可取消时露出来；位置由 touch-input.ts 的
         `cancelButtonPlacement` 算（优先放舞台外的黑边）。配色随门厅那套。 */
      #touchcancel {
        position: fixed; z-index: 42; padding: 0; border-radius: 10px;
        border: 1px solid #3a5a83; background: #22405f; color: #e9eef7;
        font: 600 16px/1.1 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; letter-spacing: 2px;
        box-shadow: 0 4px 14px rgba(0,0,0,.4);
        touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #touchcancel:active { background: #2f5680; }
      #touchcancel[hidden] { display: none; }
      #touchcancel.side { writing-mode: vertical-rl; letter-spacing: 6px; }
      #touchcancel.corner { font-size: 13px; letter-spacing: 1px; opacity: .72; border-radius: 8px; }
      /* 侧栏收成调试抽屉：默认收起，D 键开关。游戏本身的側欄画在画布里 */
      #panel {
        width: 300px; flex: none; padding: 10px; overflow-y: auto;
        background: #1a1d24; border-left: 1px solid #2a2e38;
      }
      body.no-debug #panel { display: none; }
      h1 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
      .player { padding: 8px; margin-bottom: 6px; border-radius: 6px; background: #22262f; }
      .player.active { outline: 2px solid #e8d24a; }
      .player .name { font-weight: 600; }
      .player .money { font-variant-numeric: tabular-nums; color: #9aa3b2; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
      button {
        padding: 6px 12px; border-radius: 6px; border: 1px solid #3a4050;
        background: #2a3040; color: #e6e8ee; cursor: pointer; font: inherit;
      }
      button:hover:not(:disabled) { background: #343b4d; }
      button:disabled { opacity: .4; cursor: default; }
      #log { margin-top: 12px; font-size: 12px; color: #8d95a5; max-height: 40vh; overflow-y: auto; }
      #log div { padding: 2px 0; border-bottom: 1px solid #232732; }
      .meta { color: #8d95a5; font-size: 12px; margin-bottom: 10px; }
      .err { color: #e8524a; white-space: pre-wrap; }
      /* ★ W-72 素材载入屏：只有百分比 + 一条进度条。**不显示 MB 数** ——
         分母是原始字节（247 MB）而实际流量是压缩后的（≈130 MB），
         两个数放一起会让人以为下多了。 */
      #loadbar {
        height: 6px; width: 320px; max-width: 100%; overflow: hidden;
        background: #22262f; border-radius: 3px; margin-bottom: 8px;
      }
      #loadbar[hidden] { display: none; }
      #loadfill { height: 100%; width: 0; background: #4a90d9; }
      #loadhint { color: #8d95a5; font-size: 12px; margin-bottom: 8px; }
      #loadhint[hidden] { display: none; }
      #loadretry[hidden] { display: none; }
      /* ★ 一键回报（需求方 2026-09-22）：左下角常驻按钮 + 点开的小面板。DOM，不进 canvas。 */
      #feedback {
        position: fixed; left: 14px; bottom: 14px; z-index: 40;
        padding: 7px 12px; border-radius: 8px; border: 1px solid #6b4a2b;
        background: #4a3319; color: #ffe6c2; cursor: pointer; font: 600 12px/1.2 inherit; opacity: .85;
      }
      #feedback:hover { opacity: 1; background: #5c3f1f; }
      #feedback[hidden] { display: none; }
      #feedbackpanel {
        position: fixed; left: 14px; bottom: 52px; z-index: 41; width: 300px;
        background: #17304f; border: 1px solid #2b4a70; border-radius: 10px; padding: 12px;
        box-shadow: 0 8px 28px rgba(0,0,0,.35); color: #e9eef7; font: 13px/1.4 inherit;
      }
      #feedbackpanel[hidden] { display: none; }
      #feedbackpanel textarea {
        width: 100%; box-sizing: border-box; height: 74px; resize: vertical; margin: 6px 0 8px;
        padding: 6px 8px; border-radius: 6px; border: 1px solid #3a5a83; background: #0e2138; color: #e9eef7; font: inherit;
      }
      #feedbackpanel .row { display: flex; gap: 8px; justify-content: flex-end; }
      #feedbackpanel button { padding: 6px 12px; border-radius: 6px; border: 0; cursor: pointer; font: 600 12px/1.2 inherit; }
      #feedbacksend { background: #2f7ad6; color: #fff; }
      #feedbackcancel { background: #2b4a70; color: #e9eef7; }
      /* ★ W-74 回合计时：棋盘右上角，剩余 ≤ 20 秒才露出来。
         `pointer-events: none` —— 它是提示，不许挡住棋盘的点击。 */
      #clock {
        position: fixed; z-index: 30; pointer-events: none;
        display: flex; align-items: baseline; gap: 8px;
        padding: 3px 10px 5px; border-radius: 8px;
        background: rgba(12, 24, 40, .82); border: 1px solid #3a5a83; color: #e9eef7;
        font: 700 26px/1.1 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      #clock[hidden] { display: none; }
      #clock.hot { color: #ff6b6b; border-color: #b8453f; }
      #clockname { font-size: 12px; font-weight: 500; color: #a9bcd4; }
      /* ★ W-75 联机提示：右下角堆叠（每条 4 秒自收、最多 3 条）+ 被託管的常驻横幅。
         两条都 `pointer-events: none` —— 它们是提示，不许挡住棋盘。 */
      #toasts {
        position: fixed; right: 16px; bottom: 16px; z-index: 35; pointer-events: none;
        display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
      }
      #autopilotbanner {
        position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 35;
        padding: 8px 16px; border-radius: 8px; pointer-events: none;
        background: rgba(120, 40, 30, .92); border: 1px solid #b8453f; color: #ffe9e6;
        font: 600 14px/1.3 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
      }
      #autopilotbanner[hidden] { display: none; }
      #interaction {
        margin: 10px 0; padding: 10px; border-radius: 8px;
        background: #232a38; border: 1px solid #3a4a68;
      }
      #interaction[hidden] { display: none; }
      .itx-title { font-weight: 600; color: #e8d24a; margin-bottom: 4px; }
      .itx-detail { color: #9aa3b2; font-size: 12px; margin-bottom: 8px; }
      #interaction .row { margin: 0; }
      #interaction button { padding: 5px 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <aside id="panel">
      <div class="meta" id="meta">载入中…</div>
      <div id="loadbar" hidden><div id="loadfill"></div></div>
      <div id="loadhint" hidden>首次載入約 130 MB，之後會緩存在本機</div>
      <button id="loadretry" type="button" hidden>重試</button>
      <div id="players"></div>      <div id="interaction" hidden></div>
      <div class="row" id="actions"></div>
      <div id="log"></div>
    </aside>
    <!-- ★ 一键回报：左下角常驻；点开填一句话（可不填），送出 = 飞行记录仪的报告（起点快照 + 每条 action +
         最后 120 行日志 + 截图）上传到服务器 /api/feedback（没有服务器就退回下载） -->
    <button id="feedback" type="button" title="F9 也可以">回報問題</button>
    <div id="feedbackpanel" hidden>
      <div>發現問題？簡單說一句發生了什麼（可不填）。送出時會連同剛才那幾回合的操作記錄與截圖一起交上去。</div>
      <textarea id="feedbacknote" maxlength="500" placeholder="例如：踩到空地沒有跳出買地的框"></textarea>
      <div class="row"><button id="feedbackcancel" type="button">取消</button><button id="feedbacksend" type="button">送出</button></div>
    </div>
    <!-- ★ 触屏的「取消」钮（= 一次右键；只在触屏、且有东西可取消时出现） -->
    <button id="touchcancel" type="button" hidden>取消</button>
    <!-- ★ W-75 联机提示：右下角堆叠 + 被託管的常驻横幅 -->
    <div id="toasts"></div>
    <div id="autopilotbanner" hidden>你已被託管，點一下畫面收回</div>
    <!-- ★ W-74 回合计时（棋盘右上角） -->
    <div id="clock" hidden><span id="clocknum">0</span><span id="clockname"></span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
