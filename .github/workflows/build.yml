# 桌面三平台构建（T-055 Windows / T-056 Linux / macOS）
# SPDX-License-Identifier: GPL-3.0-or-later
#
# ★ 为什么必须放 CI：Tauri 只能**在目标平台上**打目标平台的包
#   （Windows 的 .msi 要在 Windows 上打、Linux 的 AppImage 要在 Linux 上打），
#   本机是 macOS，所以 Windows/Linux 那两个只能在这里验。
#
# ⚠️ **本仓库是 code-only 公开镜像**：不含 `assets/`、没有 Git LFS，
#   `tauri.conf.json` 里也没有 `bundle.resources`。所以这里打出来的包**不含游戏数据**
#   （构建照样能过；装上去要用户自己选原版目录，见 README「素材来源」/ docs/assets.md）。
#   要出「素材随包」的包，用下面的 `RICH4_ASSETS` 指一份现成的原版安装目录。
#   ⚠️ `check` job 里读素材的测试会跳过 ⇒ **本镜像的 CI 绿只说明「没写坏」，证明不了保真**。
#   带素材的那份私有仓库里这套工作流才是完整形态（素材走 LFS、由 bundle.resources 打进包）。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    # ★ W-05：手动触发时可以只跑一个平台 —— 私有仓库 macOS runner 按 10 倍计费，
    #   「三平台一起跑、挂一个重跑」太贵；先 linux（便宜）→ windows → macos。
    inputs:
      platform:
        description: '只打包哪个平台（all = 默认组，现在=只出 macOS；linux/windows 需单独选）'
        type: choice
        options: [all, linux, windows, macos]
        default: all

jobs:
  check:
    name: 三绿（typecheck + lint + test）
    # ★ 钉死 24.04：ubuntu-latest 正在迁移，漂移会让「本地绿、CI 红」变得不可复现（W-06）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # ⚠️ 本镜像**没有 Git LFS、也没有 `assets/`**（见文件头）：原来那三步
      #   「LFS 对象清单 → 缓存 `.git/lfs` → `git lfs pull`」在这里只会空跑，已删掉。
      #   带素材的私有仓库里**必须保留**（否则 checkout 拿到的只是指针文件，
      #   "mkf 索引表偏移非法: 1936876918" = 把 "version https://git-lfs…" 当成了表头）。
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # 素材是按需的：check 不需要它
          RICH4_SKIP_ASSETS: '1'
      - run: pnpm check

  # ★ W-05：**选平台**要单独一个 job —— 不能只在 `matrix` 里收窄 `platform` 维度：
  #   GitHub 的 `include` 规则是「合不进任何组合的条目会**新建**一个组合」，
  #   于是 `platform: ["linux"]` + 三条 include 会跑出 linux **加** windows/macos
  #   三个 job（实测：手选 linux 却把 macos 也跑起来了，白烧 10 倍额度）。
  #   这里把整张矩阵 JSON 现算出来，`bundle` 直接 `fromJSON` —— 只有选中的那些。
  plan:
    name: 选平台
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # ★ W-05：Windows 只打 **NSIS**，不打 MSI —— 实测 `light.exe`（WiX 3.14）
          #   在「产品名是中文 + 输出文件名带中文」时必失败（candle 过了、light 挂），
          #   而 NSIS 支持 Unicode。MSI 想回来，得先解决 WiX 的代码页/产品名问题。
          ALL = [
              {"platform": "linux",   "runner": "ubuntu-22.04",  "target": "x86_64-unknown-linux-gnu", "bundles": "appimage,deb"},
              {"platform": "windows", "runner": "windows-latest", "target": "x86_64-pc-windows-msvc",  "bundles": "nsis"},
              {"platform": "macos",   "runner": "macos-latest",   "target": "aarch64-apple-darwin",    "bundles": "app,dmg"},
          ]
          want = os.environ.get("PLATFORM") or "all"
          if os.environ.get("EVENT") != "workflow_dispatch":
              want = "all"          # tag 推送：默认那一组
          # ★ 2026-09-19（需求方）：**默认只出 macOS** —— Windows 那条（WiX/NSIS）
          #   需求方不需要，不再随 `all` 一起跑（也省掉 Windows 的额外额度）。
          #   linux / windows 仍留在 `platform` 下拉里，想要时单独手选。
          DEFAULT = [x for x in ALL if x["platform"] == "macos"]
          sel = DEFAULT if want == "all" else [x for x in ALL if x["platform"] == want]
          print("matrix=" + json.dumps({"include": sel or DEFAULT}))
          PY

  bundle:
    name: 打包 ${{ matrix.platform }}
    needs: [check, plan]
    # ★ 三平台打包只在**打 tag** 或**手动触发**时跑：私有仓库里 macOS runner 按 10 倍、
    #   Windows 按 2 倍计分钟，每次 push 都打一遍会很快烧光免费额度。
    #   平时的 push / PR 只跑上面的「三绿」。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # ★ secrets 不能直接出现在 if 里，先落到 env 再判空（GitHub Actions 的老规矩）
    env:
      RICH4_ASSETS: ${{ secrets.RICH4_ASSETS }}
    steps:
      - uses: actions/checkout@v7
      # ⚠️ 本镜像没有 Git LFS / `assets/`：原来那三步拉素材的（W-05 的 LFS 清单 + 缓存 +
      #   `git lfs pull`）已删掉；带素材的私有仓库里请保留。
      #   这里**没有素材也能出包**，只是包内不含游戏数据 —— 要「素材随包」就走下面
      #   「取素材」那一步，用 `RICH4_ASSETS` 指一份原版安装目录。
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      # Linux 的 webkit2gtk 依赖（T-056 / W-05）
      # ★ W-05 修：`libappindicator3-dev` 在 **ubuntu-22.04 的仓库里不存在**
      #   （20.04 之后就换成 ayatana 那套了），apt 会整条失败 —— 实测第一次
      #   linux 打包就死在这一步。改成 Tauri v2 文档给的那一串，
      #   并补上 Tauri v2 需要的 `libxdo-dev`。
      - name: Linux 依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - run: pnpm install --frozen-lockfile

      # 素材：**本镜像里这是唯一一条拿素材的路**（没有 LFS 可拉）。不设 `RICH4_ASSETS`
      #   就打出不含游戏数据的包（用户第一次启动自己选目录）。
      # ★ Windows 的默认 shell 是 pwsh，下面这段是 bash 语法 ⇒ 必须钉 shell: bash。
      - name: 取素材（可选：RICH4_ASSETS）
        if: env.RICH4_ASSETS != ''
        shell: bash
        run: |
          echo "素材来源：$RICH4_ASSETS"
          mkdir -p assets/game
          # 允许是一个 tar.gz 的下载地址，或 CI 缓存里的目录
          case "$RICH4_ASSETS" in
            http*) curl -fL "$RICH4_ASSETS" -o /tmp/rich4-assets.tar.gz && tar -xzf /tmp/rich4-assets.tar.gz -C assets/game ;;
            *) cp -R "$RICH4_ASSETS"/. assets/game/ ;;
          esac

      - name: 打前端
        run: pnpm --filter @rich4/client build

      - name: 打包
        # `build` 脚本就是 `tauri build`（见 packages/desktop/package.json）
        # ★ `--bundles` 按平台给（见 plan job 里的注释）：Windows 走 NSIS，MSI 会死在 WiX。
        run: pnpm --filter @rich4/desktop build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 归档产物
        uses: actions/upload-artifact@v7
        with:
          name: rich4-remake-${{ matrix.platform }}
          # 三平台各自的产物目录都在这几个里
          path: |
            packages/desktop/src-tauri/target/**/release/bundle/**
            packages/desktop/src-tauri/target/**/release/*.exe
          if-no-files-found: warn
