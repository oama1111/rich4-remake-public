<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大富翁4 重制版</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; overflow: hidden; display: flex; background: #000; color: #e6e8ee;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      }
      /* ★ 游戏画面是一块 640×480 的定屏，整数倍放大居中 —— 见 stage.ts */
      #board {
        flex: 1 1 0; min-width: 0; width: 100%; height: 100%; display: block;
        cursor: default; image-rendering: pixelated;
      }
      /* 侧栏收成调试抽屉：默认收起，D 键开关。游戏本身的側欄画在画布里 */
      #panel {
        width: 300px; flex: none; padding: 10px; overflow-y: auto;
        background: #1a1d24; border-left: 1px solid #2a2e38;
      }
      body.no-debug #panel { display: none; }
      h1 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
      .player { padding: 8px; margin-bottom: 6px; border-radius: 6px; background: #22262f; }
      .player.active { outline: 2px solid #e8d24a; }
      .player .name { font-weight: 600; }
      .player .money { font-variant-numeric: tabular-nums; color: #9aa3b2; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
      button {
        padding: 6px 12px; border-radius: 6px; border: 1px solid #3a4050;
        background: #2a3040; color: #e6e8ee; cursor: pointer; font: inherit;
      }
      button:hover:not(:disabled) { background: #343b4d; }
      button:disabled { opacity: .4; cursor: default; }
      #log { margin-top: 12px; font-size: 12px; color: #8d95a5; max-height: 40vh; overflow-y: auto; }
      #log div { padding: 2px 0; border-bottom: 1px solid #232732; }
      .meta { color: #8d95a5; font-size: 12px; margin-bottom: 10px; }
      .err { color: #e8524a; white-space: pre-wrap; }
      /* ★ W-72 素材载入屏：只有百分比 + 一条进度条。**不显示 MB 数** ——
         分母是原始字节（247 MB）而实际流量是压缩后的（≈130 MB），
         两个数放一起会让人以为下多了。 */
      #loadbar {
        height: 6px; width: 320px; max-width: 100%; overflow: hidden;
        background: #22262f; border-radius: 3px; margin-bottom: 8px;
      }
      #loadbar[hidden] { display: none; }
      #loadfill { height: 100%; width: 0; background: #4a90d9; }
      #loadhint { color: #8d95a5; font-size: 12px; margin-bottom: 8px; }
      #loadhint[hidden] { display: none; }
      #loadretry[hidden] { display: none; }
      #interaction {
        margin: 10px 0; padding: 10px; border-radius: 8px;
        background: #232a38; border: 1px solid #3a4a68;
      }
      #interaction[hidden] { display: none; }
      .itx-title { font-weight: 600; color: #e8d24a; margin-bottom: 4px; }
      .itx-detail { color: #9aa3b2; font-size: 12px; margin-bottom: 8px; }
      #interaction .row { margin: 0; }
      #interaction button { padding: 5px 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <aside id="panel">
      <div class="meta" id="meta">载入中…</div>
      <div id="loadbar" hidden><div id="loadfill"></div></div>
      <div id="loadhint" hidden>首次載入約 130 MB，之後會緩存在本機</div>
      <button id="loadretry" type="button" hidden>重試</button>
      <div id="players"></div>
      <div id="interaction" hidden></div>
      <div class="row" id="actions"></div>
      <div id="log"></div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
