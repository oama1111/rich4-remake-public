  source: "Panel.mkf #75；U-5；rich4_ui_stock.asm"
  input: "state.market, state.holdings, state.commercialShares, state.companyFunds"
  output: "dispatch(buyStock/sellStock{stock, shares})；漲停/跌停/停牌按状态显示提示色"
  algorithm: |
    1. stockScreen.ts：底图 = 资源 75 的图 0（绿）/ 图 1（黄），整屏 640×480。
    2. 顶带五块牌子（表 0x4754c8）：页码牌 / 買進 / 賣出 / 上市公司資訊 / EXIT。
    3. 12 行 × 6 列；行高 32、第一行顶 80；值用 flag 6 右对齐。
