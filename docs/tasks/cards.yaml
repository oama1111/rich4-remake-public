  status: todo
  estimate: 0.8
  depends_on: []
  uses:
    - core/places/bank.ts, special-finance.ts
    - client/dialog.ts (AmountPage 填数页)
    - client/scenes.ts (SCENE.bank = 23)
  source: "Panel.mkf #23；docs/original-ui.md U-3：白卡左申請/右償還；董事長多一条額度；rich4_ui_bank.asm 的坐标"
  input: "pending{bank}, player 财务字段"
  output: "dispatch(bank{op, amount})；金额来自填数页；超额由 core 拒绝（返回原 state）时屏上提示"
  algorithm: |
    1. bankScreen.ts：六个钮矩形 + 四行数字（現金/存款/貸款/融資）位置；董事長时多画一行。
    2. 点钮 → 打开 AmountPage(op)，确认 → dispatch。
    3. 利率、上限只显示 core 算出的值（bank.ts 导出 interestRate/loanLimit）。
  tests: "bankScreen.test.ts：hit 六钮、董事長行显隐。"
  files: [packages/client/src/bank-screen.ts, packages/client/src/bank-screen.test.ts, packages/client/src/interactions.ts]
  status: doing
  notes: |
    **2026-09-15：先做了「ATM 半屏」（存款/提款），貸款半屏做完取证、留待下一轮。**

    ## ★ 先纠正一条：银行落点原版开**两屏**，不是一屏

    `rich4_player_core_actions.asm:2549` 起：

    ```asm
    call _rich4_ui_bank_atm_entry   ; ① ATM 屏（VA 0x4379c9）—— 存款/提款 + 数字键盘
    cmp byte [0x46caf8], 0
    jne 结束
    call _rich4_ui_bank_entry       ; ② 貸款屏（VA 0x436668）—— 申請/償還/特別融資
    ```

    两张底图、两个窗口过程、两套坐标。上一轮卡里写的「六个钮 + 四行数字」是把
    两屏混成一张了，且**从来没有六个钮**：貸款屏只有 **4 个**命中框
    （表 `0x4757f8`，见下）。

    ---

    ## ① ATM 屏（**已做**）—— `Panel.mkf` 资源 24

    | 是什么 | @source |
    |---|---|
    | 面板 = 资源 **24 图 0**（320×338），落 **(60,71)** | 入口 VA 0x437a18 的 `read_mkf(panel, 0x18, …)`；画在 `loc_00436f9d` |
    | **18 颗钮**的矩形 = 表 **`0x475888`**（每项 8 字节：x0,y0,x1,y1，**面板局部**；命中先减 60/71）| `loc_00437161` |
    | 钮的图号 = **序号 + 1**（图 1..18）| `lea edx,[ebx+1]` 后按 12 字节步进 |
    | 金额数字 = 图 **19..28** = `'0'..'9'`（18×32）；从右往左画、x 从 **304** 每字 **−20**、y=**172**、最多 **10** 位 | `fcn_00436d3a` |
    | 金额串 `[0x48c3f8]`、模式 `[0x48c3f0]` | `loc_00437161` 的 `cmp ebx,[0x48c3f0]` |
    | 「銀行暫停放款」禁止章 = 图 **29**，盖在存款钮中心 **(157,141)**，**只在 `player+0x3c != 0` 时** | `loc_00436f9d` |

    18 颗钮的名字（**把图导出来照着印的字读的**）：

    | # | 图 | 面板局部 | 是什么 |
    |---|---|---|---|
    | 0 | 1 | (57,49)-(137,90) | **存款**（一只手伸向钱）|
    | 1 | 2 | (139,49)-(219,90) | **提款**（一只手拿卡）|
    | 2 | 3 | (221,49)-(264,90) | **EXIT** |
    | 3 | 4 | (53,137)-(268,166) | 金额栏底（**不是钮**）|
    | 4..15 | 5..16 | 4 行 × 3 列、格 33×17、行距 19 列距 39 | 数字盘 `789 / 456 / 123 / C 0 ←` |
    | 16 | 17 | (183,233)-(232,258) | **MAX** |
    | 17 | 18 | (175,260)-(232,285) | **↵** |

    ★ **数字盘、MAX、↵、EXIT 的「脸」都烘在面板底图（图 0）里** —— `0x401` 那支
    只画：面板、两张「手」（图 1/图 2）、禁止章（图 29）、以及金额数字。

    行为：
    - 两颗模式钮**点当前那件不做任何事**（`cmp ebx,[0x48c3f0] / je`）；
      **冻结时点「存款」也不认**（`loc_004371da` 改用当前模式）。
    - `days_rejected_by_bank != 0` 时**整台 ATM 都不开**：入口先弹一句
      「還剩 (v & 0x7f) + 1 天」（`sprintf` 后走 `fcn_00440cac` 的訊息框）。
    - 实现：`packages/client/src/bank-screen.ts`（版式/命中/按键全纯函数，14 项测试）。
      接线在 `main.ts`：银行对话里选「存款/提款」→ 开 ATM 而不是通用填数页；
      `↵` 才发 `bank{op, amount}`，`EXIT`/金额 0 就什么都不发。

    ⚠️ **没做**：ATM 的 `0x408`（另一个子状态）、`0x100` 键盘输入那支（原版 ATM
    也收键盘）、以及**悬停反馈**（`loc_00437904` 那支还没读）。
    另：`fcn_00436d3a` 开头还有一段按 `[0x48c3ec]` 换算的**百分比**（面板上那条
    0%~100% 的进度条），也没做。

    ---

    ## ② 貸款屏（**已做**）—— `Panel.mkf` 资源 23

    窗口过程 `fcn_00435062`（VA 0x435062），用的是一串**自定义消息**当状态机
    （`0x401`..`0x40a` + `0x113` 定时器），不是普通的 WM_ 分派。

    | 是什么 | @source |
    |---|---|
    | 底图 = 资源 23 的**图 0**（640×480 店員室）或**图 2**（董事長室）| `fcn_00434186` 按「是不是董事長」二选一 |
    | 常态再叠 **图 1**（344×240 **拉下来的百叶窗**，锚点 (62,198)）—— 意思是「窗口里看不见人」；董事長那支整张换成图 2（人在里面）| `fcn_00434186`，落点 (320,240) |
    | 冻结时盖禁止章 = 图 **23** 落 **(345,345)** | 同上开头的 `player+0x3c != 0` 一支 |
    | **4 个命中框** = 表 **`0x4757f8`** | `loc_00435c12` |

    | # | 矩形 | 常态 | 董事長 |
    |---|---|---|---|
    | 0 | (548,431)-(628,471) | EXIT | 同 |
    | 1 | (282,324)-(408,366) | 申請貸款（`borrow`）| 週轉現金（`financeBorrow`）|
    | 2 | (470,326)-(590,366) | 償還貸款（`repay`）| 歸還款項（`financeRepay`）|
    | 3 | (268,51)-(591,273) | 窗（点它没反应）| **特別融資**（自带子对话框 `fcn_00434492`）|

    文字（图 0 / 图 2 上各画各的）：
    - 图 0：`申請貸款` (345,345)、`償還貸款` (530,345)，26 号 `0x101010` 居中
    - 图 2：`特別融資` (443,427)；`週轉現金` (67,324)、`歸還款項` (67,382)（20 号白字）；
      三行 16 号 `0x202020`：`客戶存款總額` (78,147)、`目前融資金額` (78,195)、
      `尚可融資金額` (78,243)，值分别画在 **(128,163)/(128,211)/(128,259)**、flag 1
      （@source `fcn_00433c20`：額度、`player+0x28` 已用、两者之差）
    - 图 2 左侧另贴三张钮图：图 16 落 (11,305)/(11,362)、图 18 落 (11,419)

    进鈕的门槛（`loc_00435d48` / `loc_00435da4`）：申請貸款要 `player+0x3c == 0`
    （没被冻结）；償還貸款要 `loan != 0` 才有反应；**窗口那颗只有董事長认**。

    实现：`packages/client/src/bank-loan.ts`（版式/命中/门槛全纯函数，8 项测试）。
    接线在 `main.ts`：`pending.kind === 'bank'` 时把這一屏画到**舞台**上（盖住
    通用对话框，ATM 开着时让位给 ATM）；点中四颗钮 → `exit` 走 `declineDecision`、
    其余三颗开**通用填数页**（复用对话里那一行的 `fill`，原版填数页
    `fcn_00453544` 也是另开一个窗口盖在银行屏上，所以这里单独把它画到舞台、
    不整块贴回棋盘画布）。
    三条数额的取值：`額度` = `available + owed`、`已用` = `owed`、`尚可融` = `available`
    （core 的 `specialFinanceAvailable` 给的就是**差**，不是額度 —— 别弄反）。
    已在浏览器里目视确认渲染（店員室 + 百叶窗 + 两颗白单子 + EXIT）。

    ⚠️ 还有两块**没跟完**：进入时建的两张离屏面（280×200 `[0x48c3b8]`、
    200×200 `[0x48c3b4]`）—— 前者画玩家头像+名字+两行（`fcn_00433d6e`），
    后者画日期（`fcn_00433f24`，用了星期名表 `0x47511c`）；以及 `0x402`..`0x40a`
    那一串状态机（表单滑入、店員反应）与 `0x113` 定时器。

    ⚠️ 另外中段的 `cross lines`：`fcn_00433c20` 里那次 `fcn_0045643d` 的
    8 个参数只解出「113×117 的一块被贴到 (135,278)」，语义未明。

- id: T-030
  group: C
  title: 股市屏（Panel.mkf 75 的主表 + 買進/賣出）
  module: MOD-12
