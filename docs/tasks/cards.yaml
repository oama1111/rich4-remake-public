- id: T-063
  group: D
  title: 重拼精灵 + 锚点 ×4 + 写 hd-manifest.json
  module: MOD-11
  req: REQ-11.1
  status: done
  estimate: 0.4
  depends_on: [T-062]
  uses: [assets/hd-manifest.json, cli-upscale.ts, upscale.ts (recordResult)]
  source: "C-AST-6；PRD §4.5（hd 路径命名）"
  input: "合并后的帧（`<done>/merged/`）+ 原 meta（队列清单 + manifest.tasks 的数字身份/原尺寸/原锚点）"
  output: "assets/hd/<档案>/<资源>-<图>.png + manifest 条目（模型/参数/输入输出哈希、outAnchor ×实际倍率）"
  algorithm: |
    1. 帧顺序按队列清单（= 原素材清单顺序）走。
    2. 锚点用 upscale 的 recordResult（内部按**实际输出尺寸**缩放）——不是把 scale 乘一下了事，
