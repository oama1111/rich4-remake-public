- id: T-007
  group: A
  title: 拍賣卡（8）——把脚下地产送入拍賣 pending
  module: MOD-06
  req: REQ-06.1
  status: done
  estimate: 0.5
  depends_on: []
  uses:
    - core/rules/auction.ts (拍賣规则：底价、竞价者、成交)
    - core/rules/interaction.ts (PendingInteraction.auction)
    - core/cards/registry.ts, core/state/reduce.ts
  source: "VA 0x00443225（rich4_card_paimaika.asm）；拍賣屏 Panel.mkf #26"
  input: "useCard(ctx, 8, { kind:'none' })，玩家站在地块/設施格上（原版不挑主：自己的、无主的也照拍，见 notes）"
  output: "state.pending = { kind:'auction', entityId, basePrice, bidders, facility? }；扣卡；phase='awaitingDecision'"
  algorithm: |
    1. 读 0x443225：底价 = round(地价×(1+等级×0.5))×物價（run_auction 0x43bde5，設施分支同式读 +0x22）；
       竞价者 = 活着且非地主的玩家；成交款进公库（不给原主）；流拍 → 变无主。
    2. registry 不能直接产生 pending（它只返回 players/lands），故 UseCardResult 增加 `followUp?: PendingInteraction`；
       reduce.ts playCard 看到 followUp 就设 pending 与 phase。
    3. 复用 rules/auction.ts 的成交逻辑（已被魔法屋/破產拍賣用）；設施结算新增 settleFacilityAuction。
  tests: "registry.test.ts：站在别人的地 → followUp.auction；自己的/无主的也照拍（敌意仅无主不记）；脚下非地块/設施 → fail。auction.test.ts：設施底价/结算 + 敌意 bug 用例。"
  files: [packages/core/src/cards/registry.ts, packages/core/src/state/reduce.ts, packages/core/src/rules/auction.ts]
  notes: "拍賣屏本身是 T-033。两处与初稿卡面不符、按 asm 改：① 原版不拦「自己的/无主的」（0x443282 只拦无主记敌意）；
