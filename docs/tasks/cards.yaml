- id: T-035
  group: C
  title: 樂透投注屏
  module: MOD-12
  req: REQ-12.11
  status: todo
  estimate: 0.5
  depends_on: []
  uses:
    - core/places/lottery.ts
    - client/scenes.ts (SCENE.lotteryCounter = 12)
  source: "Panel.mkf #12（10 张子图，已逐张导出目视核过）＋ #13 小数字牌 ＋ #14 号码格动画"
  input: "pending{lottery: available[], price, owned}"
  output: "dispatch(lottery{number})"
  algorithm: |
    `Panel#12` 的构成（只用到子图 0/1/2/7/8/9，3..6 是她的脸部件）：
    - 0 = 640×480 整屏：上半是酒吧（吧台、吊灯、酒瓶架、红墙），下半是**号码盘**
      —— 9 列 × 4 行共 36 格，编号 **01..36 本来就画在底图上**，不需要单独的格子贴图。
      ⚠️ 底图上 28 与 35 两格自带着橙色圆圈，是原画就有的（不是运行时状态）。
    - 1 = **猫女郎**（358×298，托腮+食指压唇）→ 画在 (210,−10) = 建屏默认姿势
    - 2 = **猫女郎**（414×302，招手+眨眼）→ 画在 (154,−8) = **买中之后**换成这个
    - 3/4 = 她的**眼睛贴片**（70×42，睁/闭）→ 盖在 (273,63) 上做眨眼，帧表 `0x00475660` = {3,4,3}
    - 5/6 = 嘴贴片（70×18，笑/抿）—— 本文件里**没找到引用点**
    - 7 = **红色粉笔弧**（58×47，锚点居中）→ 点中号格时画在那格上 = 需求方说的「红色粉笔」
    - 8 = 对话气泡（237×192）→ 摆在 (360,20)
    - 9 = 蓝色底板（172×28）→ 摆在 (28,27)，奖池金额就画在这块板上
    号格：9 列 × 4 行，格距 64×48，从 (30,271) 起；命中判定 `col=(x−30)/64`、
    `row=(y−271)/48`、`index=row*9+col`（@source 0x0042feae 起）。
    ★ **奖池那一块还有一层动画**：`Panel#14` = `LOTO\BONUS1.FLC`，5 帧 213×68 的
    金色灯泡跑马灯，起在 **(8,8)**；蓝板（子图 9）与金额就画在它中间那个镂空里
    （索引 0 = 不动）。它是 **ANM** 格式，见 `assets-pipeline/src/anm.ts`。
    ⚠️ 原版这个判定取得到 col=9 / row=4（index 到 44，而号码表只有 36 字节）—— 最右一列
    像素会越界写，是原版 bug，**不照抄**。
    流程：建屏铺 0/1/9/8 + 起 Panel#14 动画（@(8,8)）→ 状态 1 说 #0011 → 2 说 #0012
    → 3 说 #0013（可点）→ 点中号格 → 画 entry 7 + 扣 1000 + 进公库
    → 换 entry 2 + 说 #0014 → 关屏。现金 < 1000 时屏一闪即关（说 #0015 → #0016）。
  tests: "lotteryScreen.test.ts"
  files: [packages/client/src/lottery-screen.ts]
  notes: "★ 规则部分已对齐（2026-09-15）：一次落点只买 1 注 —— 买中的那一下 reducer 就把 pending 收了（原版 0x0042ffd1 紧接着 PostMessage(0x406,3,0)，投注屏自行关闭）。★ 美术已定位（2026-09-15 晚）：猫女郎 = 子图 1/2，红色粉笔 = 子图 7，见 algorithm。"

- id: T-036
  group: C
  title: 樂透開獎动画屏
  module: MOD-12
  req: REQ-12.11
  status: todo
  estimate: 0.5
  depends_on: [T-035]
  uses:
    - core/places/lottery.ts (開獎结果已在 state.lastEvent / lottery)
    - core/places/lottery-ceremony.ts (★ 引擎侧的演出脚本，2026-09-15 已写)
    - client/scenes.ts (SCENE.lotteryDraw = 15)
  source: "Panel.mkf #15（47 张子图，已逐张导出目视核过）＋ #16 摇球机动画 ＋ #17 得主面板 ＋ #13 小数字牌"
  input: "開獎结果（中奖号、得主、公库金额）"
  output: "纯播放；结束后关闭"
  algorithm: |
    `Panel#15` 的构成：0 = 640×480 舞台底图（蓝幕布＋玻璃摇奖球＋台座＋标题）；
    1..6 = 同一个女主持人的六个姿势（竖手指／摊手／举板／捂嘴带汗／大笑／举板过顶跳）；
    7..21 = 脸部贴片（眼、嘴、整张苦笑脸）；22 对话气泡；23 黄爆炸框（空号）；
    24 红爆炸框（中奖）；25..36 十二个角色头像徽章；37..46 号码球 0..9（71×70，锚点居中）。

    ★ **两块动画是 ANM**（不是 SPR/SMP 精灵表，格式见 `assets-pipeline/src/anm.ts`）：
    - `Panel#16` = `LOTOOPEN\LOTOBALL.FLC`，42 帧 275×270 —— **玻璃球里的球被吹起来翻滚**
      （第 0 帧是球堆在底部），起在 (183,75)，正好套在底图那个玻璃球上；
    - `Panel#17` = `256_S\A01.FLC`，37 帧 280×480 —— **双红球炸开成彩带礼花**，起在 (205,0)。
    ★ 但**中奖号那两颗球不滚**：开号那一刻直接用 Panel#15 的 37..46 贴出来
    （十位在 (286,405)、个位在 (358,405)）。先前记的「摇球 N 帧 → 停在中奖号」是错的。

    十态状态机（原版 `0x48c37b` + 50 ms 定时器；每一步说完话、铺完图、数完帧才走下一步）：
    建屏（`fcn_0042f6c3`：底图＋左举板＋右竖手指＋气泡＋累積獎金/公库＋各人持号表）
    → 1 说 #0017 → 2 说 #0018 → 3 起 Panel#16 摇球＋数 20 帧＋**等它放完**（42 帧 ≈ 2.1 s）
    → 开号（两颗球直接贴出）
    → 中奖：4 左举板过顶/右大笑/中央红爆炸框＋得主名＋起 Panel#17 礼花，说 #0019
            → 5 数 30 帧等动画 → 6 说 #0032 → 8 → 9 说 #0035 → 10 说 #0036 → 派彩关屏
    → 空号：先硬停 500 ms，7 左脸换苦笑(子图 21)＋右捂嘴＋中央黄爆炸框，说 #0033
            → 8 说 #0034 → 9 说 #0035 → 10 说 #0036 → 派彩关屏（公库不清）
    「擦除」的手法：从干净子图上**原样拷一块矩形回来**（`fcn_0045643d`，参数是
    `(dest, sprite, dx,dy, sx,sy, w,h)`），不是填背景色。

    ★ 台词串首的 `'#'+4 位数字` 是**插播 Speaking.mkf 的语音号**，渲染时被吃掉
    （见 `messages.ts` 的 LOTTERY 段），所以屏上显示的文字不含它。
  tests: "lottery-ceremony.test.ts（状态序列/台词顺序/停顿/每个矩形都落在子图内）；anm.test.ts（#16/#17 能解出 42/37 帧）"
  files: [packages/client/src/lottery-screen.ts, packages/core/src/places/lottery-ceremony.ts, packages/assets-pipeline/src/anm.ts]
  notes: |
    引擎侧的脚本 **已写**（`core/places/lottery-ceremony.ts`，纯数据＋纯函数），
    ANM 解码器 **已写**（`assets-pipeline/src/anm.ts`）—— 剩下的是 client 那一屏：
    按脚本播、把子图和解码好的 Panel#15 画上去、脸部贴片按帧号抽（`facePartsAt`）、
    两块 ANM 按帧播。
    ⚠️ 三处未实机核对：状态 6/8 的擦除矩形只对上了大部分；脸部动画「一个槽播几帧停下」
       的条件是位运算推的；ANM 播放器只实装了 flags bit0=1 那条路径。

