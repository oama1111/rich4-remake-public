  tests: "stock-screen.test.ts：牌子与行的命中（开区间）、量级→小数位、涨跌类→颜色、12 行的取数。"
  files: [packages/client/src/stock-screen.ts, packages/client/src/stock-screen.test.ts]
  notes: |
    **2026-09-15 做完主表这一屏**（详情卡与持股页另开 T-030b）。

    ## ★ 先前三条认错，先纠正

    1. 这一屏**不在** `pending` 那条路上（不是落点交互）：入口
       `_rich4_ui_stock_entry`（VA 0x42b58f）由**工具栏第 11 颗「股市」**打开
       （`rich4_ui_clicking_top_panel.asm:101`，参数 0 = 买卖模式）；
       `scenes.ts` 里那张 75 的登记只是「整屏底图」，与这里不是一条路。
    2. **紅卡／黑卡选股票也走这一屏**（`rich4_card_hongka.asm:90`、
       `rich4_card_heika.asm:68`，参数 1／2）—— 这正是 Q-PICK-2 里
       「紅卡/黑卡选股票的原版 UI 没做」的答案：它不是另做一屏，
       而是同一屏换个模式（`[0x48c2ed]`：1 → 给选中那支打 `+7 = 0x20`、
       2 → 打 `2`，然后 `Post_0402` 把选择抛回去）。**那一半还没做**。
    3. 卡片里写的「休市日整屏只读」**方向对、机理错**：不是「整屏只读」，
       是那一支压根走的是**訊息框**窗口过程 —— 只有底图 + 三颗钮的字 + 「本日休市」，
       没有任何行情数字，且**任何一下鼠标都直接退屏**（见 Q-STOCK-5）。
    4. 持股页（图 1）的**页头与行情页完全不同**：股票名稱 + **各玩家名** +
       保留股份 + 累積盈餘（Q-STOCK-4）。

    ## 版式（全部照 exe）

    | 是什么 | @source |
    |---|---|
    | 底图 = 资源 75 的图 0／图 1（两张 640×480，**同一张桌子两个色**）| 入口 `read_mkf(panel, 0x4b, 0, 0)` |
    | **五块牌子** = 表 `0x4754c8`（每项 16B x0,y0,x1,y1，**开区间**）| 命中 `loc_0042ad6c` / `loc_0042ae26` |
    | 牌子动作跳表 `ref_0042aaeb` | 0 换页 / 1 買進 / 2 賣出 / 3 上市公司資訊 / 4 EXIT |
    | 12 行：`15 < x < 625`、`80 < y < 464`、高 **32** | `loc_0042ae2c`；文字在 y=96+32i |
    | 六列（表头烘在图里，y=64）：股票名稱 76 / 成交價 188 / 漲跌 280 / 交易量 368 / 持有股數 468 / 平均成本 572 | 入口 0x42b5c8 起 |
    | 值右对齐 x = 225 / 305 / 401 / 504 / 609；停牌那格改画 `暫停交易`(368 居中) | `loc_0042994c` / `loc_004299e7` / `loc_00429ac9` |
    | 顶带右上 = **存款**（`$`+千分位）右对齐 x=540 | `loc_004297f7` 开头 |
    | 小数位跟**价格量级**：`<15` → `%.2f`、`<150` → `%.1f`、否则 `%.0f`（漲跌共用）| `fcn_00429691` + 表 `0x475518`/`0x475524` |
    | 涨跌类 = core 的 `STOCK_STATUS`（0 漲/1 漲停/2 跌/3 跌停/4 平）| `fcn_004295ea`（在 `rich4_stocks.asm`）|
    | 颜色跳表 `ref_004297cf`：漲=红字、**漲停=暗红框**(144,y−10,89,20)+白字、跌=绿字、**跌停=暗绿框**+黑字、平=白字 | 同上 |
    | 買進：漲停不理（`漲停無法買進！`）；上限 `min(流通量, 存款÷股價)` | `loc_0042aee4` / `loc_0042af30` |
    | 賣出：跌停不理（`跌停無法賣出！`）；上限 = 持股数 | `loc_0042afff` |
    | **休市**：走訊息框那一支 —— 只有底图 + 三颗钮的字 + `本日休市`（72 号字，(324,244) 黑 + (320,240) 白），**没有行情也没有可点的东西** | 入口 0x42b745 **之外**的一支（`jne` 跳开的那边才是开市）|
    | 持股页页头：`股票名稱`(71) + 各玩家名(168+80i) + `保留股份`(492) + `累積盈餘`(580) | 入口 0x42b856 起 |
    | **董事长那格**：蓝底 + 黄字（`commercial+0x18` 命中者）| `loc_00429ba1` |
    | 右键：在持股页退回行情页、在行情页则离开 | `loc_0042b22f` |

    ★ **两张 640×480 是两页**（不是两个状态）：点页码牌 `[0x48c2ec] ^= 1` 换页
    （`loc_0042aec4`），`fcn_004297f7(page)` 贴 chunk[page] 后画这一页的值。
    ⚠️ **两页的标题是反的**：图 0 标题写着 `持有股數表` 却是行情表、图 1 写着
    `股 價 表` 却是持股/经营表 —— 字烘在图里，照抄不替它改。

    ## 实现与接线

    - `client/stock-screen.ts`：版式/命中/格式/取数**全是纯函数**（18 项测试）。
    - 接线在 `main.ts`：工具栏 `case 10` → `openStock()`；`screen = 'stock'`
      时整屏画它；买/卖**合成一个「对话」**（`stockAmountUi`）喂给通用填数页，
      于是「−/+、最大、確定、取消」那一套排版与命中直接复用。
    - `core/index.ts` 加了一行 `export * from './places/stock-market.ts'`
      （先前 barrel 里没有它，client 拿不到 `stockStatus`）。

    ## 目视验收（2026-09-15，真实浏览器）

    休市（元旦）：整屏只有底图 + 牌子 + `本日休市`，**点任意处退屏**（退到棋盘）✓；
    工作日：12 行与六列对齐 ✓、量级小数位 ✓（100.0 / 180 / 310）、
    上市公司名字与持股两列是**青字** ✓、选中行白框 ✓、
    買進 → 填数页上限 `min(5000, 100000÷100)=1000` ✓ → 確定后
    持股 0→1000、存款 100000→0、交易量 5000→4000 ✓；賣出 → 持股归 0、
