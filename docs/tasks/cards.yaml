    `drawInventory('cards')` 已经写好并测过，T-025 接上去即可。
    - **网格是量底图量的**：图上有 6 条竖分隔线 x=5/84/164/244/324/404、
      4 条横分隔线 y=5/60/116/172 ⇒ 首格 **(5,5)**、间距 **(80,56)**、格 **76×52**；
      5 + 5×80 = 405 ≈ 图宽 412、5 + 3×56 = 173 ≈ 图高 180，两头对得上。
